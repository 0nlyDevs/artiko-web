version: '3'

set: [errexit, nounset, pipefail]

tasks:
  check:versions:
    desc: Fail when the active Node or pnpm differs from mise.toml, or pnpm from package.json
    run: once
    silent: true
    vars:
      PINNED_NODE:
        sh: sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml
      PINNED_PNPM:
        sh: sed -n 's/^pnpm = "\(.*\)"$/\1/p' mise.toml
      PACKAGE_MANAGER_PNPM:
        sh: >-
          sed -n 's/^  "packageManager": "pnpm@\(.*\)"$/\1/p' package.json
    preconditions:
      - sh: test -n "{{.PINNED_PNPM}}" && test "{{.PINNED_PNPM}}" = "{{.PACKAGE_MANAGER_PNPM}}"
        msg: 'pnpm "{{.PINNED_PNPM}}" in mise.toml differs from packageManager "pnpm@{{.PACKAGE_MANAGER_PNPM}}" in package.json'
      - sh: test -n "{{.PINNED_NODE}}" && test "$(node -v 2>/dev/null)" = "v{{.PINNED_NODE}}"
        msg: 'Node {{.PINNED_NODE}} expected by mise.toml: run `mise install` and run Task from the mise environment'
      - sh: test "$(pnpm -v 2>/dev/null)" = "{{.PINNED_PNPM}}"
        msg: 'pnpm {{.PINNED_PNPM}} expected by mise.toml: run `mise install` and run Task from the mise environment'

  install:
    desc: Install dependencies from the lockfile (skipped while the lockfile is unchanged)
    run: once
    deps: [check:versions]
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
    generates: [node_modules/.modules.yaml]
    cmds:
      - pnpm install --frozen-lockfile

  audit:
    desc: Fail on high or critical vulnerabilities in production dependencies
    deps: [check:versions]
    cmds:
      - pnpm audit --prod --audit-level high

  lint:
    desc: Lint with ESLint
    deps: [install]
    cmds:
      - pnpm lint

  typecheck:
    desc: Generate the Next.js route types, then type-check the whole project with tsc --noEmit
    deps: [install]
    cmds:
      - pnpm typecheck

  test:
    desc: Run the unit tests once
    deps: [install]
    cmds:
      - pnpm test

  build:
    desc: Install dependencies and build the production bundle
    deps: [install]
    cmds:
      - pnpm build

  ci:
    desc: Run the CI pipeline in order and stop at the first failure
    cmds:
      - task: install
      - task: audit
      - task: lint
      - task: typecheck
      - task: test
      - task: build

  dev:
    desc: Start the dev server on http://localhost:3000
    deps: [install]
    cmds:
      - pnpm dev

  api:generate:
    desc: Regenerate the API client from artiko-api/openapi.yml (set OPENAPI_SPEC to override)
    deps: [install]
    cmds:
      - pnpm api:generate

  secrets:scan:
    desc: Scan the whole git history for secrets with gitleaks
    cmds:
      - gitleaks git --no-banner --redact --verbose .

  hooks:install:
    desc: Point git at the versioned .githooks directory (gitleaks pre-commit)
    vars:
      CURRENT_HOOKS_PATH:
        sh: git config --get core.hooksPath || true
      LEGACY_PRE_COMMIT:
        sh: echo "$(git rev-parse --git-common-dir)/hooks/pre-commit"
    preconditions:
      - sh: test -z "{{.CURRENT_HOOKS_PATH}}" || test "{{.CURRENT_HOOKS_PATH}}" = .githooks
        msg: 'core.hooksPath is already "{{.CURRENT_HOOKS_PATH}}": refusing to replace it'
      - sh: test ! -e "{{.LEGACY_PRE_COMMIT}}"
        msg: '{{.LEGACY_PRE_COMMIT}} exists and core.hooksPath would silently bypass it: move it into .githooks/ or remove it first'
    cmds:
      - git config core.hooksPath .githooks
      - echo "pre-commit hook installed (core.hooksPath=.githooks)"
